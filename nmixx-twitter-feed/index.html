<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMIXX Twitter Feed</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="https://platform.twitter.com/widgets.js" as="script">
    <script defer src="https://platform.twitter.com/widgets.js"></script>
</head>
<body>

    <div style="text-align: center; margin-top: 20px;">
        <h1>NMIXX Twitter Feed</h1>
    </div>

    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>

    <div class="container">
        <div class="column">
            <h1>NMIXX Official Tweets</h1>
            <a class="twitter-timeline"
               href="https://twitter.com/NMIXX_official"
               data-theme="light"
               data-width="100%"
               data-height="750"
               data-tweet-limit="5"></a>
        </div>

        <div class="column">
            <h1>WE_NMIXX Tweets</h1>
            <a class="twitter-timeline"
               href="https://twitter.com/WE_NMIXX"
               data-theme="light"
               data-width="100%"
               data-height="750"
               data-tweet-limit="5"></a>
        </div>
    </div>

    <div class="github">
        <a href="https://github.com/Nathaniel1024" target="_blank">
            <img id="github-logo" src="github-mark.svg" alt="GitHub Logo" width="50" height="50">
        </a>
    </div>

    <script>
        function toggleDarkMode() {
            const body = document.body;
            const btn = document.querySelector(".toggle-btn");
            const isDarkMode = body.classList.toggle("dark-mode");
            localStorage.setItem("darkMode", isDarkMode);

            btn.textContent = isDarkMode ? "☀️ Light Mode" : "🌙 Dark Mode";

            const feeds = document.querySelectorAll(".twitter-timeline");
            feeds.forEach(feed => feed.setAttribute("data-theme", isDarkMode ? "dark" : "light"));

            if (window.twttr) twttr.widgets.load();
        }
    </script>

</body>
</html>
